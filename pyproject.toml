[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "qwenn-strategies"
version = "0.1.0"
description = "Neural-symbolic framework for trading strategy generation and verification"
license = "Apache-2.0"
maintainer = "codingsh <codingsh@pm.me>"
requires-python = ">=3.8"
keywords = ["bend", "qwen", "strategies", "neural-symbolic", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.scripts]
qwenn-strategies = "qwenn_strategies.strategy_gen:main"

[tool.setuptools.packages.find]
include = ["qwenn_strategies"]